# Validation-selected configuration for the final benchmark run.
# Shared training/evaluation/hardware settings remain identical for every
# method and dataset. Only method-specific parameters are tuned below.

methods:
  - max_softmax
  - deep_ensemble
  - packed_ensemble
  - batch_ensemble
  - snapshot_ensemble
  - variational_bnn
  - swag
  - sgld
  - sghmc
  - edl
  - temperature_scaling
  - laplace_approx
  - mc_dropout
  - mc_batch_norm

backbones:
  - resnet

datasets:
  - name: seu
    root: /mnt/d/Data/Machine/SEU
  - name: pu
    root: /mnt/d/Data/Machine/PU
  - name: cwru
    root: /mnt/d/Data/Machine/CWRU
  - name: wt
    root: /mnt/d/Data/Machine/WT
  - name: xjtu
    root: /mnt/d/Data/Machine/XJTU
  - name: hit
    root: /mnt/d/Data/Machine/HIT

training:
  epochs: 50
  batch_size: 128
  learning_rate: 0.001
  seeds: [0, 1, 2, 3, 4]
  n_runs: 5
  val_split: 0.2

evaluation:
  noise: true
  shift: true

hardware:
  accelerator: auto
  devices: 1
  strategy: auto
  precision: 32

output:
  dir: results

method_args:
  deep_ensemble:
    num_estimators: 4
    ood_criterion: mi
  packed_ensemble:
    num_estimators: 4
    alpha: 4
    gamma: 1
  batch_ensemble:
    num_estimators: 4
  snapshot_ensemble:
    cycle_length: 5
  checkpoint_ensemble:
    cycle_start: 5
    cycle_length: 5
  variational_bnn:
    kl_weight: 0.0001
    num_samples: 10
    ood_criterion: mi
  swag:
    cycle_start: 25
    cycle_length: 1
    num_estimators: 10
  sgld:
    pretrain_epochs: 20
    pretrain_lr: 0.001
    cycle_start: 5
    cycle_length: 5
    noise_factor: 0.01
    num_estimators: 10
  sghmc:
    pretrain_epochs: 20
    pretrain_lr: 0.01
    cycle_start: 10
    cycle_length: 4
    friction: 0.05
    burn_in_steps: 200
    noise_factor: 0.01
    num_estimators: 10
  edl:
    reg_weight: 0.00001
    weight_decay: 0.0
    loss_type: mse
  laplace_approx:
    weight_subset: last_layer
    hessian_struct: kron
  temperature_scaling:
    min_temperature: 0.1
    max_temperature: 10.0
  mc_dropout:
    dropout_rate: 0.1
    num_estimators: 10
    ood_criterion: mi
  mc_batch_norm:
    num_estimators: 10
    mc_batch_size: 4
    last_only: true

# Dataset-specific overrides are limited to method-owned parameters.
method_dataset_args:
  edl:
    xjtu:
      loss_type: digamma
  snapshot_ensemble:
    pu:
      cycle_length: 10
    xjtu:
      cycle_length: 10
    cwru:
      cycle_length: 10
  sghmc:
    xjtu:
      friction: 0.1

runner:
  continue_on_error: true
  overwrite: true
